<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aleksei Nikolayevich Tsaritsyn-Snezhnoy — Standby</title>
<meta name="theme-color" content="#05070a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#05070a;
    --ink-2:#070a10;
    --ember:#5b8fb3;
    --ember-hot:#bfe4ff;
    --gold:#d8c98f;
    --paper:#f2f6fa;
    --line: rgba(216,201,143,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    width:100%;
    background:var(--ink);
    overflow:hidden;
    font-family: Georgia, 'Iowan Old Style', serif;
  }

  .stage{
    position:relative;
    width:100%;
    height:100dvh;
    background:
      radial-gradient(ellipse at 68% 50%, rgba(91,143,179,0.30), transparent 60%),
      linear-gradient(120deg, #040507 0%, #070a10 45%, #0a1420 100%);
    display:flex;
    align-items:center;
    overflow:hidden;
  }

  /* drifting embers, always running */
  .embers{ position:absolute; inset:0; pointer-events:none; }
  .embers span{
    position:absolute;
    bottom:-10px;
    width:3px; height:3px;
    background:var(--ember-hot);
    border-radius:50%;
    opacity:0;
    filter: drop-shadow(0 0 4px var(--ember-hot));
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:.85; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }

  .vignette{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.72) 100%);
    pointer-events:none;
  }

  /* emblem — continuous spin, independent of the reveal loop */
  .emblem-wrap{
    position:absolute;
    right:4%;
    top:50%;
    transform:translateY(-50%);
    width:min(46vw, 560px);
    height:min(46vw, 560px);
  }
  .emblem-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    filter: drop-shadow(0 0 26px rgba(191,228,255,.35));
    animation: spin 5s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* light sweep, replays every cycle */
  .sweep{
    position:absolute; inset:0;
    background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.06) 48%, transparent 56%);
    transform: translateX(-120%);
    pointer-events:none;
    animation: sweep 2.6s ease-out .4s forwards;
  }
  @keyframes sweep{
    to{ transform:translateX(20%); }
  }

  .titleblock{
    position:relative;
    z-index:3;
    padding-left:7%;
    max-width:62%;
  }

  .rule{
    width:0;
    height:1px;
    background: linear-gradient(90deg, var(--ember-hot), transparent);
    box-shadow:0 0 8px var(--ember-hot);
    margin-bottom:18px;
    animation: ruleGrow .9s ease-out .9s forwards;
  }
  @keyframes ruleGrow{ to{ width:180px; } }

  h1.name{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(2.1rem, 5.6vw, 4.6rem);
    line-height:1.06;
    margin:0 0 12px 0;
    color:var(--paper);
    opacity:0;
    filter: blur(6px);
    transform: translateY(18px);
    text-shadow: 0 0 30px rgba(191,228,255,0.25), 0 2px 0 rgba(0,0,0,.6);
    animation: nameIn 1.1s cubic-bezier(.2,.8,.2,1) .55s forwards;
  }
  @keyframes nameIn{
    to{ opacity:1; filter:blur(0); transform:translateY(0); }
  }

  .epithet{
    font-style:italic;
    font-size:clamp(1rem, 1.7vw, 1.4rem);
    color:var(--gold);
    margin:0 0 14px 0;
    opacity:0;
    transform:translateY(10px);
    animation: lineIn .8s ease-out 1.15s forwards;
  }

  .roles{
    margin:0;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .roles li{
    font-size:clamp(.9rem, 1.3vw, 1.1rem);
    color: rgba(242,246,250,0.82);
    letter-spacing:.02em;
    opacity:0;
    transform:translateY(10px);
  }
  .roles li:nth-child(1){ animation: lineIn .7s ease-out 1.35s forwards; }
  .roles li:nth-child(2){ animation: lineIn .7s ease-out 1.55s forwards; }

  @keyframes lineIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .meta{
    position:absolute;
    left:7%;
    bottom:6%;
    z-index:3;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size:.72rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: rgba(242,246,250,0.4);
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    animation: lineIn .8s ease-out 1.9s forwards;
  }
  .meta .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--ember-hot);
    box-shadow:0 0 6px var(--ember-hot);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:.25; }
  }

  @media (max-width: 760px){
    .titleblock{
      max-width:88%;
      padding-left:0;
      margin:0 auto;
      text-align:center;
    }
    .stage{ justify-content:center; }
    .rule{ margin-left:auto; margin-right:auto; animation-name: ruleGrowCenter; }
    @keyframes ruleGrowCenter{ to{ width:120px; } }
    .roles{ align-items:center; }
    .emblem-wrap{
      right:auto;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:min(120vw, 620px);
      height:min(120vw, 620px);
      opacity:.22;
      z-index:1;
    }
    .titleblock{ z-index:2; }
    .meta{
      left:0;
      right:0;
      bottom:5%;
      justify-content:center;
    }
  }

  @media (max-width: 420px){
    h1.name{ font-size:clamp(1.7rem, 8vw, 2.4rem); }
  }

  @media (prefers-reduced-motion: reduce){
    .embers, .emblem-wrap img{ animation:none; }
    .rule, h1.name, .epithet, .roles li, .meta, .sweep{ animation-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="embers" id="embers"></div>

  <div class="emblem-wrap">
    <img src="icon.png" alt="">
  </div>

  <div class="sweep"></div>
  <div class="vignette"></div>

  <div class="titleblock">
    <div class="rule"></div>
    <h1 class="name">Aleksei Nikolayevich<br>Tsaritsyn-Snezhnoy</h1>
    <p class="epithet">The Wanderer</p>
    <ul class="roles">
      <li>Human</li>
      <li>Currently wandering ✦</li>
    </ul>
  </div>

  <div class="meta"><span class="dot"></span>standby — looping</div>
</div>

<script>
  // The reveal (rule / name / epithet / roles / meta) plays exactly once
  // and then holds still. Only the embers, the icon spin, and the standby
  // dot keep looping — that's the "standby" state.
  const embers = document.getElementById('embers');

  function spawnEmbers(){
    embers.innerHTML = '';
    const COUNT = window.innerWidth < 760 ? 16 : 26;
    for(let i=0;i<COUNT;i++){
      const s = document.createElement('span');
      const left = Math.random()*100;
      const dur = 6 + Math.random()*7;
      const delay = Math.random()*8;
      const drift = (Math.random()*60-30) + 'px';
      s.style.left = left+'%';
      s.style.animationDuration = dur+'s';
      s.style.animationDelay = delay+'s';
      s.style.setProperty('--drift', drift);
      embers.appendChild(s);
    }
  }
  spawnEmbers();

  // refresh ember density if the viewport crosses the mobile breakpoint
  let lastNarrow = window.innerWidth < 760;
  window.addEventListener('resize', () => {
    const nowNarrow = window.innerWidth < 760;
    if(nowNarrow !== lastNarrow){
      lastNarrow = nowNarrow;
      spawnEmbers();
    }
  });
</script>

</body>
</html>
